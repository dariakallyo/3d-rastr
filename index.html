<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dot Relief</title>
<style>
  :root { --panel: rgba(20,20,20,.82); --text: #eee; --muted: #999; --accent: #f0a050; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b0b; color: var(--text);
    font: 13px/1.4 -apple-system, system-ui, sans-serif; }
  body { display: flex; }
  canvas { display: block; }
  #panel { flex: 0 0 270px; height: 100%; padding: 14px; overflow-y: auto;
    background: #161616; border-right: 1px solid #2a2a2a; }
  #stage { flex: 1; position: relative; min-width: 0; overflow: hidden; }
  .bgrow { display: flex; gap: 8px; align-items: center; }
  .bgrow input { flex: 0 0 44px; height: 34px; }
  .bgrow button { margin: 0; }
  #panel h1 { font-size: 14px; margin: 0 0 10px; }
  .row { margin: 10px 0; }
  .row label { display: flex; justify-content: space-between; color: var(--muted); margin-bottom: 4px; }
  .row label b { color: var(--text); font-weight: 500; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .toggle { display: flex; align-items: center; gap: 8px; color: var(--text); cursor: pointer; }
  .toggle input { accent-color: var(--accent); }
  fieldset { border: 1px solid #333; border-radius: 8px; padding: 6px 10px; margin: 10px 0; }
  fieldset .row { margin: 6px 0; }
  button, .file { display: block; width: 100%; padding: 8px; margin: 6px 0; border: 1px solid #444; border-radius: 6px;
    background: #222; color: var(--text); cursor: pointer; text-align: center; font: inherit; }
  button:hover, .file:hover { border-color: var(--accent); }
  button.rec { border-color: #e44; color: #f66; }
  .file input { display: none; }
  .hint { color: var(--muted); font-size: 11px; margin-top: 8px; }
  #drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 20px;
    background: rgba(240,160,80,.15); border: 3px dashed var(--accent); pointer-events: none; }
  body.dragging #drop { display: flex; }
</style>
</head>
<body>
<div id="panel">
  <h1>Dot Relief</h1>
  <label class="file">Загрузить картинку<input type="file" id="file" accept="image/*"></label>

  <div class="row">
    <label>Плотность (шариков по ширине) <b id="densityVal"></b></label>
    <input type="range" id="density" min="30" max="400" step="1" value="160">
  </div>
  <div class="row">
    <label>Цвет фона <b></b></label>
    <div class="bgrow">
      <input type="color" id="bg" value="#0b0b0b">
      <button id="fly">Облёт камеры</button>
    </div>
  </div>

  <fieldset>
    <label class="toggle"><input type="checkbox" id="useBright" checked> Рельеф по яркости</label>
    <div class="row"><label>Глубина <b id="brightVal"></b></label>
      <input type="range" id="bright" min="-60" max="60" step="1" value="20"></div>
  </fieldset>
  <fieldset>
    <label class="toggle"><input type="checkbox" id="useWave" checked> Волна</label>
    <div class="row"><label>Амплитуда <b id="waveVal"></b></label>
      <input type="range" id="wave" min="0" max="30" step="0.5" value="4"></div>
  </fieldset>
  <fieldset>
    <label class="toggle"><input type="checkbox" id="useMouse" checked> Реакция на мышь</label>
    <div class="row"><label>Сила (− притянуть / + вытолкнуть) <b id="mouseVal"></b></label>
      <input type="range" id="mouse" min="-40" max="40" step="1" value="20"></div>
  </fieldset>

  <button id="png">Сохранить PNG</button>
  <button id="rec">● Записать видео</button>
  <div class="hint">Вращение — ЛКМ, сдвиг — ПКМ, зум — колесо. Картинку можно перетащить в окно.</div>
</div>
<div id="stage"></div>
<div id="drop">Отпусти, чтобы загрузить</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);

// --- scene ---
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const stage = $('stage');
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color($('bg').value);
const camera = new THREE.PerspectiveCamera(40, 1, 1, 5000);
camera.position.set(0, 0, 180);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const WORLD_W = 100; // ширина изображения в мировых единицах

const uniforms = {
  uTime: { value: 0 },
  uSize: { value: 1 },
  uScale: { value: 1 },
  uBright: { value: 20 },
  uWave: { value: 4 },
  uMouse: { value: new THREE.Vector2(9999, 9999) },
  uMouseForce: { value: 20 },
  uMouseOn: { value: 0 },
  uMouseRadius: { value: 12 },
};

const material = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: /* glsl */`
    attribute vec3 color;
    attribute float luma;
    uniform float uTime, uSize, uScale, uBright, uWave, uMouseForce, uMouseOn, uMouseRadius;
    uniform vec2 uMouse;
    varying vec3 vColor;
    void main() {
      vec3 p = position;
      p.z += (luma - 0.5) * uBright;
      p.z += uWave * sin(p.x * 0.08 + uTime * 1.3) * cos(p.y * 0.06 + uTime * 0.9);
      vec2 fromMouse = p.xy - uMouse;
      float d = length(fromMouse);
      float fall = uMouseOn * uMouseForce * exp(-(d * d) / (uMouseRadius * uMouseRadius));
      p.z += fall;
      // лёгкий разлёт в стороны от курсора
      p.xy += (d > 0.001 ? fromMouse / d : vec2(0.0)) * fall * 0.06;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = uSize * uScale / -mv.z;
      vColor = color;
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vColor;
    void main() {
      vec2 c = (gl_PointCoord - 0.5) * 2.0;
      float r2 = dot(c, c);
      if (r2 > 1.0) discard;
      // нормаль псевдо-сферы (в пространстве камеры)
      vec3 n = vec3(c.x, -c.y, sqrt(1.0 - r2));
      vec3 L = normalize(vec3(-0.5, 0.6, 0.8));
      // мягкое "обёрнутое" освещение — края не уходят в чёрное, без тёмной обводки
      float diff = dot(n, L) * 0.5 + 0.5;
      float spec = pow(max(dot(reflect(-L, n), vec3(0.0, 0.0, 1.0)), 0.0), 24.0);
      vec3 col = vColor * (0.55 + 0.6 * diff) + spec * 0.25;
      gl_FragColor = vec4(col, 1.0);
    }`,
});

let points = null;
let sourceImage = null;

function build() {
  if (!sourceImage) return;
  const cols = +$('density').value;
  const aspect = sourceImage.height / sourceImage.width;
  const rows = Math.max(1, Math.round(cols * aspect));
  const cv = document.createElement('canvas');
  cv.width = cols; cv.height = rows;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(sourceImage, 0, 0, cols, rows);
  const data = ctx.getImageData(0, 0, cols, rows).data;

  const n = cols * rows;
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3), luma = new Float32Array(n);
  const step = WORLD_W / cols;
  const linear = new THREE.Color();
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const i = y * cols + x, k = i * 4;
    const r = data[k] / 255, g = data[k + 1] / 255, b = data[k + 2] / 255;
    pos[i * 3] = (x - (cols - 1) / 2) * step;
    pos[i * 3 + 1] = ((rows - 1) / 2 - y) * step;
    linear.setRGB(r, g, b, THREE.SRGBColorSpace);
    col.set([linear.r, linear.g, linear.b], i * 3);
    luma[i] = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('luma', new THREE.BufferAttribute(luma, 1));

  if (points) { points.geometry.dispose(); scene.remove(points); }
  points = new THREE.Points(geo, material);
  scene.add(points);
  uniforms.uSize.value = step * 0.95;
  uniforms.uMouseRadius.value = WORLD_W * 0.12;
}

function loadImage(src) {
  const img = new Image();
  img.onload = () => { sourceImage = img; build(); };
  img.src = src;
}

// стартовая картинка-заглушка, пока не загрузили свою
function placeholder() {
  const c = document.createElement('canvas');
  c.width = 600; c.height = 800;
  const g = c.getContext('2d');
  g.fillStyle = '#111'; g.fillRect(0, 0, 600, 800);
  const blobs = [[300, 380, 140, '#f2ede4'], [160, 520, 110, '#e89a80'], [460, 320, 100, '#f0a050'],
                 [200, 200, 90, '#d98870'], [430, 600, 120, '#8a8040'], [320, 650, 90, '#6d6a30']];
  for (const [x, y, r, color] of blobs) {
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, color); grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  return c.toDataURL();
}
loadImage(placeholder());

// --- UI ---
function bindRange(id, onChange) {
  const el = $(id), out = $(id + 'Val');
  const upd = () => { out.textContent = el.value; onChange(+el.value); };
  el.addEventListener('input', upd); upd();
}
let rebuildTimer;
bindRange('density', () => { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(build, 80); });
bindRange('bright', v => uniforms.uBright.value = $('useBright').checked ? v : 0);
bindRange('wave', v => uniforms.uWave.value = $('useWave').checked ? v : 0);
bindRange('mouse', v => uniforms.uMouseForce.value = v);
$('useBright').onchange = () => $('bright').dispatchEvent(new Event('input'));
$('useWave').onchange = () => $('wave').dispatchEvent(new Event('input'));
$('bg').oninput = e => scene.background.set(e.target.value);

$('file').onchange = e => { const f = e.target.files[0]; if (f) loadImage(URL.createObjectURL(f)); };
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', () => document.body.classList.remove('dragging'));
addEventListener('drop', e => {
  e.preventDefault(); document.body.classList.remove('dragging');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) loadImage(URL.createObjectURL(f));
});

$('png').onclick = () => {
  const a = document.createElement('a');
  a.href = renderer.domElement.toDataURL('image/png');
  a.download = 'dot-relief.png'; a.click();
};

let recorder = null;
$('rec').onclick = () => {
  const btn = $('rec');
  if (recorder) { recorder.stop(); return; }
  const stream = renderer.domElement.captureStream(60);
  // mp4 в приоритете; webm — запасной вариант для браузеров без mp4 в MediaRecorder
  const mime = ['video/mp4;codecs=avc1.640028', 'video/mp4;codecs=avc1', 'video/mp4',
                'video/webm;codecs=vp9', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
  if (ext !== 'mp4') alert('Этот браузер не умеет писать MP4 — видео сохранится в WebM. MP4 работает в свежем Chrome и Safari.');
  recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 16e6 });
  const chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: mime.split(';')[0] }));
    a.download = 'dot-relief.' + ext; a.click();
    recorder = null; btn.textContent = '● Записать видео'; btn.classList.remove('rec');
  };
  recorder.start();
  btn.textContent = '■ Остановить запись'; btn.classList.add('rec');
};

// --- мышь: проекция курсора на плоскость изображения ---
const raycaster = new THREE.Raycaster();
const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const ndc = new THREE.Vector2(), hit = new THREE.Vector3();
let hovering = false;
renderer.domElement.addEventListener('pointermove', e => {
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX - rect.left) / rect.width * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  hovering = !!raycaster.ray.intersectPlane(plane, hit);
  if (hovering) uniforms.uMouse.value.set(hit.x, hit.y);
});
renderer.domElement.addEventListener('pointerleave', () => hovering = false);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  // перевод мирового размера шарика в пиксели
  uniforms.uScale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
}
addEventListener('resize', resize); resize();

// --- плавный облёт: покачивание добавляется поверх ручного вращения,
// поэтому мышью можно крутить и во время облёта ---
let flying = false, flyT = 0, flyAmp = 0, prevTheta = 0, prevPhi = 0;
const flyOffset = new THREE.Vector3(), flySph = new THREE.Spherical();
$('fly').onclick = () => {
  flying = !flying;
  $('fly').textContent = flying ? 'Стоп облёт' : 'Облёт камеры';
};
function updateFly(dt) {
  flyAmp += ((flying ? 1 : 0) - flyAmp) * Math.min(1, dt * 1.5); // плавный старт и остановка
  if (flyAmp < 1e-4 && !flying) { flyAmp = prevTheta = prevPhi = 0; return; }
  flyT += dt;
  const theta = flyAmp * 0.6 * Math.sin(flyT * 0.4);   // влево-вправо
  const phi = flyAmp * -0.25 * Math.sin(flyT * 0.31);  // вверх-вниз
  flyOffset.copy(camera.position).sub(controls.target);
  flySph.setFromVector3(flyOffset);
  flySph.theta += theta - prevTheta;
  flySph.phi = THREE.MathUtils.clamp(flySph.phi + phi - prevPhi, 0.01, Math.PI - 0.01);
  prevTheta = theta; prevPhi = phi;
  camera.position.setFromSpherical(flySph).add(controls.target);
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  uniforms.uTime.value = clock.elapsedTime;
  const target = $('useMouse').checked && hovering ? 1 : 0;
  uniforms.uMouseOn.value += (target - uniforms.uMouseOn.value) * 0.1;
  updateFly(dt);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
